name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Run tests
        run: mvn test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: version
        run: |
          TAG=$(date +%Y%m%d)-$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/yousun1314/weather-backend:${{ steps.version.outputs.tag }}
            ghcr.io/yousun1314/weather-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/yousun1314/weather-frontend:${{ steps.version.outputs.tag }}
            ghcr.io/yousun1314/weather-frontend:latest

      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: yousun1314/weather-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: weather-gitops

      - name: Update image tags in gitops repo
        run: |
          cd weather-gitops
          # 更新 backend 镜像标签
          sed -i "s|image: ghcr.io/yousun1314/weather-backend:.*|image: ghcr.io/yousun1314/weather-backend:${{ steps.version.outputs.tag }}|" overlays/prod/backend/deployment.yaml
          # 更新 frontend 镜像标签
          sed -i "s|image: ghcr.io/yousun1314/weather-frontend:.*|image: ghcr.io/yousun1314/weather-frontend:${{ steps.version.outputs.tag }}|" overlays/prod/frontend/deployment.yaml
          # 提交并推�?
          git config user.name "CI Bot"
          git config user.email "ci@github-actions"
          git add overlays/prod/
          git diff --cached --quiet || git commit -m "chore: update image tags to ${{ steps.version.outputs.tag }}"
          git push
