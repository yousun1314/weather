server.port=8080
weather.api.base-url=https://restapi.amap.com
weather.api.key=${AMAP_API_KEY:299528262e805387dfa5ca56de19e7b4}

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
weather.cache.ttl=600

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/weather_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
